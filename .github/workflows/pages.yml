# Rebuild the site on every push to main and deploy it to the gh-pages branch.
# Uses committed artefacts (PDFs, article.md, notebooks); no TeX needed.
# In the repo settings: Pages -> Build and deployment -> Deploy from a branch -> gh-pages / (root).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc zip
          python -m pip install -r requirements.txt
      - name: Build site
        run: python scripts/build_site.py --repo "${{ github.repository }}"
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
